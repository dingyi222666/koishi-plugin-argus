$desc: Argus configuration
$inner:
    path: WebSocket mount path; must start with /.
    token: Auth token for clients; if empty all connections are rejected.
    commandName: Top-level command name (e.g. peek, spy, look).
    blur: Default blur radius; larger means blurrier (0 disables blur).
    blurMode:
        $desc: Blur algorithm
        $inner:
            - Gaussian blur (better quality, slower)
            - Fast blur (jimp.blur, faster)
    minBlur: Lower bound for the temporary -b override, to prevent unblurred captures.
    maxImageKB: Max screenshot size (client -> plugin, encrypted base64) in KB. Larger payloads are rejected. Default 8192 (8MB).
    finalMaxKB: Final image size budget after blur (KB). The plugin recompresses to JPEG within this budget before sending to chat. Default 200. Set 0 to disable.
    timeout: Timeout (ms) waiting for a client response.
    cacheDuration: Screenshot cache duration in ms. Repeated calls within this window for the same client+display reuse the cached image. Set to 0 to disable. Default 5 minutes.
    registerAlias: Whether to register each connected client's name as a command alias.
    authority: Minimum authority level required to run the command.
    forceAuthority: Minimum authority level required to use -f / --force to bypass the cache.
