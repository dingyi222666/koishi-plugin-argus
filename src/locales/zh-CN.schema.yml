$desc: Argus 屏幕截图服务
$inner:
    path: 客户端连接到 Koishi 时使用的 WebSocket 路径，例如 /argus。
    token: 客户端连接时必须提供的密钥。留空会拒绝所有客户端连接。
    commandName: 截图命令的名称，默认是 peek，也可以改成 spy 或 look。
    blur: 截图的默认模糊程度，数值越大越模糊；设置为 0 表示不模糊。
    blurMode:
        $desc: 模糊方式
        $inner:
            - 高斯模糊：效果更自然，但处理速度较慢。
            - 快速模糊：处理速度更快，适合对响应速度要求较高的场景。
    minBlur: 允许在命令中使用 -b 临时降低模糊程度的最低值。设为 0 表示允许完全不模糊。
    maxImageKB: 客户端上传截图的大小上限，单位是 KB。超过上限的截图会被拒绝，默认是 8192 KB（8 MB）。
    finalMaxKB: 发送到聊天中的图片大小上限，单位是 KB。处理完成后会自动压缩图片，默认是 200 KB；设为 0 表示不限制。
    timeout: 等待客户端返回截图的最长时间，单位是毫秒。超时后会提示截图失败。
    cacheDuration: 截图缓存时间，单位是毫秒。相同客户端、显示器和模糊程度在这段时间内会复用上一张截图，默认是 5 分钟；设为 0 表示关闭缓存。
    registerAlias: 是否为每个在线客户端创建一个同名命令。例如客户端名为 dingyi 时，可以直接使用 /dingyi 截图。
    enableChatLunaTool: 是否向 ChatLuna 和 Character Agent 提供查询在线客户端、获取截图的工具。启用前需要安装并启用 ChatLuna Storage。
    chatLunaToolBlur: ChatLuna 和 Character Agent 使用的模糊程度。它独立于上面的 blur 和 minBlur；设置为 0 表示不模糊。
    authority: 使用截图命令和 Agent 工具所需的最低权限等级。
    forceAuthority: 使用 -f / --force 获取最新截图、跳过缓存所需的最低权限等级。
