commands:
    peek:
        description: Capture a screenshot from a connected client.
        usage: |-
            peek [name] [-d display] [-b blur] [-f] [--list]
        examples: |-
            peek
            peek dingyi
            peek dingyi -d 1
            peek dingyi -b 80
            peek dingyi -f
            peek --list
        options:
            display: Display ID to capture.
            blur: Temporarily change the blur amount. It cannot be lower than minBlur.
            list: Show all currently connected clients.
            force: Capture a fresh screenshot instead of using the cache. Requires forceAuthority.
        messages:
            no-clients: No clients are currently connected.
            multiple-clients: 'More than one client is online. Specify a client name: {0}'
            client-offline: 'Client "{0}" is not connected.'
            timeout: 'Client "{0}" did not respond in time.'
            image-too-large: The screenshot is larger than the configured limit.
            failed: 'Screenshot failed: {0}'
            list-header: 'Online clients ({0}):'
            busy: 'Client "{0}" is busy: {1}'
            cache-note: '(cached; {0} remaining)'
